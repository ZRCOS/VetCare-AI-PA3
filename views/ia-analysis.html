<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Análisis IA - VetCare</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div>VetCare AI / Nueva Atención</div>
        <a href="dashboard.html">Cancelar</a>
    </nav>

    <div class="main-content">
        <div class="card">
            <h2 style="color: var(--primary-color);">Consulta Asistida por IA</h2>
            <p>Dicte o escriba los síntomas. Verifique la sugerencia antes de guardar.</p>

            <div style="display: flex; gap: 20px; margin-top: 20px;">
                
                <div style="flex: 1;">
                    <label><strong>Notas Clínicas (Raw Data):</strong></label>
                    <textarea id="inputText" rows="12" style="width: 100%; padding: 10px; margin-top: 5px;">Paciente Bobby, canino. Presenta vómitos y temperatura de 39.5. Dueño indica que comió basura ayer. Se recomienda dieta blanda y omeprazol 20mg.</textarea>
                    <button onclick="procesarIA()" class="btn-primary" style="margin-top: 15px;">✨ PROCESAR CON IA</button>
                </div>

                <div style="flex: 1; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                    <label><strong>Ficha Clínica Estructurada (Editable):</strong></label>
                    
                    <div id="loader" class="loading-spinner" style="display: none;"></div>

                    <div id="resultados" style="display: none; margin-top: 10px;">
                        
                        <label style="font-size: 0.8rem;">Diagnóstico:</label>
                        <input type="text" id="diagInput" style="width: 100%; padding: 8px; margin-bottom: 10px;" value="">

                        <label style="font-size: 0.8rem;">Síntomas Detectados:</label>
                        <input type="text" id="sintInput" style="width: 100%; padding: 8px; margin-bottom: 10px;" value="">

                        <label style="font-size: 0.8rem;">Tratamiento/Receta:</label>
                        <textarea id="tratInput" rows="4" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>

                        <hr>
                        
                        <div style="margin-bottom: 15px; display: flex; align-items: center;">
                            <input type="checkbox" id="sendEmail" checked style="width: auto; margin-right: 10px;">
                            <label for="sendEmail" style="font-size: 0.9rem; color: var(--primary-color); cursor: pointer;">
                                <i class="fas fa-envelope"></i> Enviar resumen automáticamente al propietario
                            </label>
                        </div>

                        <button onclick="guardarFicha()" class="btn-primary" style="background-color: #28a745;">
                            <i class="fas fa-save"></i> CONFIRMAR Y GUARDAR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function procesarIA() {
            document.getElementById('resultados').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultados').style.display = 'block';
                
                // Simulación de la IA llenando los campos
                document.getElementById('diagInput').value = "Gastroenteritis aguda por ingesta indebida";
                document.getElementById('sintInput').value = "Vómitos, Fiebre (39.5°C), Dolor abdominal";
                document.getElementById('tratInput').value = "1. Omeprazol 20mg (1 tab c/24h)\n2. Dieta blanda x 3 días\n3. Hidratación oral constante";
            }, 2000);
        }

        function guardarFicha() {
            const enviaCorreo = document.getElementById('sendEmail').checked;
            let mensaje = "Ficha clínica guardada en el historial de Bobby.";
            if(enviaCorreo) {
                mensaje += "\n\n📧 Se ha enviado el correo de resumen al propietario.";
            }
            alert(mensaje);
            window.location.href = 'ver-ficha.html'; // Nos lleva al historial actualizado
        }
    </script>
</body>
</html>
